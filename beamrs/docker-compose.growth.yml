services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beamrs
      POSTGRES_USER: beamrs
      POSTGRES_PASSWORD: beamrs
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beamrs -d beamrs"]
      interval: 3s
      timeout: 3s
      retries: 20
