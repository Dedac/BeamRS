[package]
name = "beamrs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { version = "1.0", optional = true }
async-trait = { version = "0.1", optional = true }
axum = { version = "0.7", features = ["macros"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
dotenvy = { version = "0.15", optional = true }
gloo-net = { version = "0.6", optional = true }
js-sys = { version = "=0.3.77", optional = true }
leptos = { version = "0.6" }
leptos_axum = { version = "0.6", optional = true }
leptos_meta = { version = "0.6" }
leptos_router = { version = "0.6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate"], optional = true }
thiserror = { version = "2.0", optional = true }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "signal"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.5", features = ["fs", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
urlencoding = { version = "2.0", optional = true }
wasm-bindgen = { version = "=0.2.100", optional = true }
wasm-bindgen-futures = { version = "=0.4.50", optional = true }
web-sys = { version = "=0.3.77", features = [
    "CanvasGradient",
    "CanvasRenderingContext2d",
    "Document",
    "HtmlCanvasElement",
    "MediaQueryList",
    "Storage",
    "Window",
], optional = true }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1.0"

[features]
default = ["ssr"]
hydrate = [
    "dep:console_error_panic_hook",
    "dep:gloo-net",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "leptos/hydrate",
    "leptos_meta/hydrate",
    "leptos_router/hydrate",
]
ssr = [
    "dep:anyhow",
    "dep:async-trait",
    "dep:axum",
    "dep:dotenvy",
    "dep:leptos_axum",
    "dep:sqlx",
    "dep:thiserror",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:urlencoding",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.wasm-release]
inherits = "release"
opt-level = "z"

[package.metadata.leptos]
output-name = "beamrs"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "static/style.css"
assets-dir = "public"
site-addr = "0.0.0.0:8080"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
