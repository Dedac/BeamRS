name: BeamRS CI

on:
  push:
    branches: [ main, dedac-curly-spoon ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beamrs
          POSTGRES_USER: beamrs
          POSTGRES_PASSWORD: beamrs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beamrs -d beamrs"
          --health-interval 10s
          --timeout 5s
          --retries 5
    env:
      DATABASE_URL: postgresql://beamrs:beamrs@localhost:5432/beamrs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: ./beamrs
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: ./beamrs
      - name: Test
        run: cargo test --all-targets
        working-directory: ./beamrs
      - name: Build
        run: cargo build --release
        working-directory: ./beamrs
